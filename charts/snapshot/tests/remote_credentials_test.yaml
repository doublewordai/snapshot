suite: remote metadata credential projection
templates:
  - templates/daemonset.yaml
tests:
  - it: projects the dedicated Secret's token and certificate files only into the agent
    set:
      operator.enabled: false
      daemonset.nodeSelector:
        kubernetes.io/hostname: node-a
      daemonset.remoteControlPlane:
        kubeconfigSecret: metadata-credentials
        providerNamespace: offloaded
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: metadata-kubeconfig
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: metadata-credentials
      - equal:
          path: spec.template.spec.volumes[0].secret.defaultMode
          value: 256
      - notExists:
          path: spec.template.spec.volumes[0].secret.items
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: metadata-kubeconfig
            mountPath: /etc/snapshot-remote
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: metadata-kubeconfig
          any: true
